      - run: npm ci --ignore-scripts
      - run: pip install -r python-hosted/requirements.txt
      - run: cd python-hosted && python test_python.py
      - name: Commit only verified Python variant
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add python-hosted
          git commit -m 'Add AI-assisted Python Flask and PostgreSQL portfolio variant'
          git push origin HEAD:proof-python-postgres
