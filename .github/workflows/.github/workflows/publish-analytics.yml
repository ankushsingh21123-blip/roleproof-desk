name: Publish AI-assisted synthetic analytics proof
on:
  push:
    branches: [proof-python-postgres]
    paths: [.github/workflows/publish-analytics.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/proof-python-postgres'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof-python-postgres
      - name: Expand reviewed hash-verified sources to fixed paths
        shell: python
        run: |
          import base64,hashlib,json,pathlib,subprocess
          payload = ''
          expected = {'python-hosted/analytics.py': '83166fd3ca78b417409c7a0d0605bbe0e16c11ff07cdd55fb93c2ac5d207a00b', 'python-hosted/analytics.html': 'd5e0ef0baabf1da9dbee849f545955f9932bd33d697ef5c4fdd73061fb0b4ef3', 'python-hosted/analytics.js': 'b5b1f15cd1e2705f3aa1b0913c9917b8e172f6c2f6e0f5e3376f1d32f0f00aba', 'python-hosted/analytics.css': 'ea80be1baf9fc72c45a6099dd23e1f7b72d6907e36f8d818a5a7cd1dbfe6b50c', 'python-hosted/test_analytics.py': '502f1d0f46b5eb0efbdc61fa217f56e71d3b9641c82ebb2bf7504bfafbb205f2', 'python-hosted/ANALYTICS.md': '677111e94d263419325ae2a0179735ee23c164415eeba9b902d89d258f752f36', 'python-hosted/app.py': '3e0e4e51bdd5ddea78181c02170736df6d12ed59b1b478effce2c57774cfecb1'}
          sources = json.loads(base64.b64decode(payload))
          assert set(sources)==set(expected)
          for name,encoded in sources.items():
              data=base64.b64decode(encoded)
              assert hashlib.sha256(data).hexdigest()==expected[name]
              path=pathlib.Path(name)
              assert path.parent==pathlib.Path('python-hosted')
              path.write_bytes(data)
          subprocess.run(['python','-m','py_compile','python-hosted/analytics.py','python-hosted/app.py'],check=True)
      - name: Publish additive proof and remove temporary publisher
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- python-hosted/analytics.py python-hosted/analytics.html python-hosted/analytics.js python-hosted/analytics.css python-hosted/test_analytics.py python-hosted/ANALYTICS.md python-hosted/app.py
          git rm -- .github/workflows/publish-analytics.yml
          git commit -m 'Add AI-assisted synthetic SQL funnel proof; preserve PostgreSQL ticket app'
          git push origin HEAD:proof-python-postgres
