name: Verify and publish build-tool security maintenance
on:
  push:
    branches: [proof-python-postgres]
    paths: [.github/workflows/maintain-build.yml]
permissions:
  contents: write
jobs:
  verify-publish:
    if: github.ref == 'refs/heads/proof-python-postgres'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof-python-postgres
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand reviewed fixed source paths
        shell: python
        run: |
          import base64,gzip,hashlib,json,pathlib
          sources=json.loads(gzip.decompress(base64.b64decode('')))
          expected={'package.json': 'bce0192e3e73653ab92940f69395c4aabd9adb31d7605d46c62e402fecb84fcb', 'package-lock.json': 'd22a97dfad60ef5408d8ea5997e1d473c0f39d2ee263d2e4480a351e1e7d96d5', 'build-legacy.mjs': 'e4148ec4689268efac1ebe79168a48bcc8d11099df680c48026dc88026d9d1f1', 'BUILD_MAINTENANCE_2026_11_18.md': '9dac21f245723011c3a348e15313dc15f8a2b89cce5aa237cdfbde012110699c'}
          assert set(sources)==set(expected)
          for name,value in sources.items():
              data=base64.b64decode(value)
              assert hashlib.sha256(data).hexdigest()==expected[name]
              pathlib.Path(name).write_bytes(data)
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: npm run test:postgres
      - run: npm run test:api
      - run: npm run test:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:worker
      - run: pip install -r python-hosted/requirements.txt
      - run: cd python-hosted && python test_analytics.py && python test_python.py
      - name: Commit only after the unchanged audit and tests pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- package.json package-lock.json build-legacy.mjs BUILD_MAINTENANCE_2026_11_18.md
          git rm -- vite.config.ts .github/workflows/maintain-build.yml
          git commit -m 'Replace vulnerable legacy bundler chain; verify audit and regression suites'
          git push origin HEAD:proof-python-postgres
