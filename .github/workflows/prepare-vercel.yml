name: Publish isolated Vercel variant
on:
  push:
    branches: [deploy-vercel-postgres]
    paths: [.github/workflows/prepare-vercel.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/deploy-vercel-postgres'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand fixed public portfolio source
        run: |
          python3 - <<'PYCODE'
          import base64,hashlib,io,zipfile,json,pathlib
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='8b70f7a78b3839db10cb595f5ab6e10ab8d0716c13b770a1a0b332564f34a931'
          z=zipfile.ZipFile(io.BytesIO(data))
          manifest=json.loads(z.read('vercel-source-manifest.json'))
          assert set(z.namelist())==set(manifest)|{'vercel-source-manifest.json'}
          for p,sha in manifest.items():
              assert not p.startswith('/') and '..' not in pathlib.PurePosixPath(p).parts
              assert hashlib.sha256(z.read(p)).hexdigest()==sha
          z.extractall('.')
          PYCODE
      - name: Commit only the verified source on its own branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api schema.postgres.sql vercel.json main.tsx package.json package-lock.json tests VERCEL_DEPLOYMENT.md POSTGRES_LOCAL_TEST_RESULTS.txt vercel-source-manifest.json
          git commit -m 'Add AI-assisted Vercel Postgres variant with real PostgreSQL tests'
          git push origin HEAD:deploy-vercel-postgres
